name: Generate and deploy the Pages site

on:
  workflow_call:

permissions: {}
concurrency:
  group: ridecast-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Calculate both rain outlooks
        shell: bash
        run: |
          previous="$RUNNER_TEMP/ridecast-previous.json"
          if curl --fail --silent --show-error --max-time 20 \
              'https://jowettc.github.io/ridecast/forecast.json' --output "$previous"; then
            node scripts/update-forecast.mjs --previous "$previous"
          else
            node scripts/update-forecast.mjs
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish site
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
